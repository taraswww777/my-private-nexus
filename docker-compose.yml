version: '3.8'

services:
  nexus:
    image: sonatype/nexus3:3.77.2   # можно заменить на актуальную версию
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      # Bind mount: данные Nexus лежат в папке ./nexus-data рядом с этим файлом
      - ./nexus-data:/nexus-data
    environment:
      # Опционально: настройка памяти JVM (под ваш объём кеша)
      - INSTALL4J_ADD_VM_PARAMS=-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g
    env_file:
      - .env
